name: Build NurseLog Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Android Project Scaffolding
        run: |
          mkdir -p assets
          flutter create . --platforms=android --org=com.nurselog
          rm -f test/widget_test.dart
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            sed -i 's/android:label="nurselog"/android:label="NurseLog"/g' android/app/src/main/AndroidManifest.xml
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test test/shift_model_test.dart test/shift_controller_test.dart

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nurselog-android-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.0
          name: "NurseLog v1.0.0 (Release APK)"
          body: |
            ### NurseLog - Android Release APK
            
            Download `app-release.apk` below directly to your Android device to install NurseLog.
          files: build/app/outputs/flutter-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
